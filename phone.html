<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>炘也的碎碎念</title>
<meta name="theme-color" id="metaThemeColor" content="#fff8f0">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#fff8f3;--bg2:#fff0e8;--card:#fff;
  --text:#5d3a2e;--text-mid:#8d6e63;--text-light:#b0857a;
  --border:#f0ddd5;--pink:#f48fb1;--pink-deep:#e91e63;--accent:#c97c5a;
}
html.dark{
  --bg:#16121e;--bg2:#221a2c;--card:#261820;
  --text:#f0dde0;--text-mid:#c0a0a8;--text-light:#8a6878;
  --border:#3a2530;--pink:#f48fb1;--pink-deep:#ff6090;--accent:#e0a080;
}
html,body{height:100%;font-family:-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}

/* ===== 顶栏 ===== */
.head{
  display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;
  border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg);z-index:5;
}
.ava{width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0;
  background:var(--bg2);border:1px solid var(--border)}
.head-main{flex:1;min-width:0}
.head-name{font-size:14px;font-weight:700;color:var(--text);line-height:1.3}
.head-sub{font-size:11px;color:var(--text-light);line-height:1.3;margin-top:1px}
.acts{display:flex;gap:2px;flex-shrink:0}
.act{
  width:34px;height:34px;border:none;background:none;color:var(--text-light);cursor:pointer;
  display:flex;align-items:center;justify-content:center;border-radius:50%;
}
.act:active{color:var(--pink-deep)}

/* ===== 标签栏（去色块：只有文字 + 细下划线） ===== */
.tags{
  display:flex;gap:16px;padding:0 14px;overflow-x:auto;flex-shrink:0;
  border-bottom:1px solid var(--border);scrollbar-width:none;background:var(--bg);
}
.tags::-webkit-scrollbar{display:none}
.tag{
  border:none;background:none;padding:11px 0 9px;font-size:13px;font-weight:600;
  color:var(--text-light);cursor:pointer;white-space:nowrap;font-family:inherit;
  border-bottom:2px solid transparent;transition:color .15s,border-color .15s;
}
.tag.on{color:var(--pink-deep);border-bottom-color:var(--pink-deep)}
.tag:active{opacity:.7}
.tag .n{font-size:10px;opacity:.55;margin-left:3px}

/* ===== 信息流 ===== */
.feed{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.item{padding:16px 16px 15px;border-bottom:1px solid var(--border);touch-action:pan-y}
/* ⚠️⚠️ 2026-09-19 真机踩到：禁选择**必须直接写在后代身上**。
   只写在 .item 上时，Chromium 会把 none 传给子级（桌面实测子元素 computed 就是 none），
   但鸿蒙的 WebView 不认这个传递 —— 她真机上长按照样划词，"复制/分享/全选"整套菜单都弹出来。
   所以子孙一律显式写死，别指望继承。 */
.item,.item *{
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  -webkit-touch-callout:none;   /* 顺带关掉长按弹菜单那种系统行为 */
}
.item:last-child{border-bottom:none}
.it-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.it-badge{
  font-size:10px;font-weight:700;color:var(--accent);letter-spacing:.4px;
}
.it-time{font-size:11px;color:var(--text-light);margin-left:auto;white-space:nowrap}
/* 「⋯」—— **系统抢不走的那条路**。她真机上长按被系统划词吃了两回，所以留一个
   点一下就必然能用的入口（长按仍然在，这里只是保底）。嫌碍眼说一声就摘掉。 */
.it-more{border:none;background:none;color:var(--text-light);font-family:inherit;
  padding:0 0 0 10px;cursor:pointer;line-height:0;display:inline-flex;align-items:center}
.it-more:active{color:var(--pink-deep)}
.it-text{font-size:14.5px;line-height:1.72;color:var(--text);white-space:pre-wrap;word-break:break-word}
.it-why{margin-top:7px;font-size:13px;line-height:1.6;color:var(--text-mid)}
.it-src{font-size:12px;color:var(--text-light);margin-top:6px}
.it-src a{color:var(--pink-deep);text-decoration:none;border-bottom:1px dotted currentColor}
.it-img{margin-top:10px}
.it-img img{width:100%;max-width:340px;border-radius:12px;display:block;background:var(--bg2);cursor:zoom-in}
.it-cap{margin-top:8px;font-size:13.5px;line-height:1.65;color:var(--text-mid)}
.it-todo{display:flex;gap:8px;align-items:flex-start}
.it-dot{width:6px;height:6px;border-radius:50%;background:var(--pink);margin-top:8px;flex-shrink:0}
.it-todo.done .it-text{color:var(--text-light);text-decoration:line-through}
.it-when{font-size:11.5px;color:var(--accent);margin-top:6px}
.it-when.past{color:var(--text-light)}

/* ===== 他自己写的（碎碎念，2026-09-16）===== */
.post-reply{margin-top:12px;border:1px solid var(--border);background:none;color:var(--pink-deep);
  font-family:inherit;font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:14px;cursor:pointer}
.post-reply:active{opacity:.6}
.post-voice{display:inline-flex;align-items:center;gap:7px;margin-top:10px;
  border:1px solid var(--border);background:var(--bg2);color:var(--text);
  font-family:inherit;font-size:13px;padding:7px 16px;border-radius:16px;cursor:pointer}
.post-voice.on{border-color:var(--pink);color:var(--pink-deep)}
.post-voice-ic{font-size:11px;line-height:1}

/* ===== 空状态 ===== */
.empty{padding:70px 30px;text-align:center;color:var(--text-light);font-size:13.5px;line-height:2}

/* ===== 加载更多 ===== */
.more-wrap{padding:14px 0 4px;text-align:center}
.more{border:none;background:none;color:var(--text-light);font-size:13px;cursor:pointer;
  font-family:inherit;padding:8px 20px;font-weight:600}
.more:active{color:var(--pink-deep)}

/* ===== 图片大图 ===== */
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:50;
  display:flex;align-items:center;justify-content:center;padding:20px}
.viewer[hidden]{display:none}
.viewer img{max-width:100%;max-height:100%;border-radius:10px;object-fit:contain}
.viewer-close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;
  width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.14);
  color:#fff;font-size:22px;line-height:1;cursor:pointer}
/* 保存（2026-09-17 加）：她问「说说带的图我喜欢怎么保存」—— 那之前查看器只能看 */
.viewer-save{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom,0px));left:50%;
  transform:translateX(-50%);padding:11px 26px;border-radius:999px;border:none;
  background:rgba(255,255,255,.18);color:#fff;font-size:14.5px;font-family:inherit;
  letter-spacing:.5px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.viewer-save:disabled{opacity:.5}
.viewer-save:active{background:rgba(255,255,255,.3)}
/* 提示词（2026-09-17 加）：她问「说说里的图能看见生图时的 prompt 吗」—— 以前只存了图，没存提示词 */
.viewer-prompt{position:absolute;left:18px;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));
  max-height:24vh;overflow:auto;padding:10px 12px;border-radius:12px;
  background:rgba(255,255,255,.1);color:rgba(255,255,255,.86);
  font-size:12.5px;line-height:1.65;word-break:break-word;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.viewer-prompt[hidden]{display:none}

/* ===== 独立打开时的提示条 ===== */
.tip{
  margin:0;padding:10px 14px;font-size:12.5px;line-height:1.6;
  background:rgba(244,143,177,.14);color:var(--text);border-bottom:1px solid var(--border);
}
.tip b{color:var(--pink-deep)}
.tip button{border:none;background:none;color:var(--text-light);font-size:12px;
  font-family:inherit;cursor:pointer;float:right;padding:0 4px}

/* ===== 长按删除（2026-09-19 加）=====
   她说「这一页攒下来的重复删不掉」—— deleteRecord 一直存在，但全项目没人调用过。
   长按一条 → 底部浮出确认。⚠️ 只给**能定位到 IDB 记录**的条目挂（it.store + it.id）：
   老数据的 drafts/mood 是聚合对象（key 是 'current'/'history'），删不了，不挂长按。 */
.item.pressing{background:var(--bg2)}
.sheet{position:fixed;inset:0;z-index:55;display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.3);
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
/* ⚠️ 悬浮层必须留 backdrop-filter（去色块那条审美线：底色可以不要，模糊不能丢） */
.sheet-box{position:relative;width:100%;padding:16px 16px calc(14px + env(safe-area-inset-bottom,0px));
  background:rgba(255,248,243,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--border);border-radius:18px 18px 0 0}
html.dark .sheet-box{background:rgba(38,24,32,.94)}
.sheet-txt{font-size:13px;line-height:1.65;color:var(--text-mid);margin-bottom:12px;
  max-height:22vh;overflow:auto;white-space:pre-wrap;word-break:break-word}
/* 「复制」是给 user-select:none 的补偿 —— 禁了划词，总得有个别的办法把他的话带走。
   ⚠️ 这条写了 display:block，会盖掉 [hidden] 的默认 display:none，所以要自己补一条 */
.sheet-copy{display:block;width:100%;padding:13px;margin-bottom:2px;border:none;border-radius:14px;
  background:none;color:var(--text);font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
.sheet-copy[hidden]{display:none}
.sheet-copy:active{opacity:.6}
.sheet-del{display:block;width:100%;padding:13px;border:none;border-radius:14px;background:none;
  font-family:inherit;font-size:15px;font-weight:700;color:#d9534f;cursor:pointer}
.sheet-del[hidden]{display:none}   /* 同上：display:block 会盖掉 [hidden] 的默认值 */
html.dark .sheet-del{color:#ff7b72}
.sheet-del:active{opacity:.6}
.sheet-cancel{display:block;width:100%;padding:12px;margin-top:2px;border:none;border-radius:14px;
  background:none;color:var(--text-light);font-family:inherit;font-size:14.5px;cursor:pointer}
.sheet-cancel:active{opacity:.6}

/* ===== 轻提示 ===== */
#toast{
  position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);
  background:rgba(40,25,30,.92);color:#fff;font-size:13px;padding:9px 18px;border-radius:20px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:86%;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="tip" id="tip" hidden>
  <button id="tipClose">知道了</button>
  这里是<b>炘也的碎碎念</b>，现在住在主 APP 的底部「碎碎念」标签里。
  从这个图标进会读到<b>另一套数据</b>（浏览器和 APP 是分开存的），<b>桌面这个图标可以删掉了</b>。
</div>

<header class="head">
  <img class="ava" id="ava" alt="">
  <div class="head-main">
    <div class="head-name">炘也</div>
    <div class="head-sub" id="headSub">读一读他一个人的时候</div>
  </div>
  <div class="acts">
    <button class="act" id="btnExport" title="导出备份">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7.5 10.5 12 15l4.5-4.5"/><path d="M4 19h16"/></svg>
    </button>
    <button class="act" id="btnImport" title="导入合并">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M7.5 7.5 12 3l4.5 4.5"/><path d="M4 19h16"/></svg>
    </button>
  </div>
</header>

<nav class="tags" id="tags"></nav>
<main class="feed" id="feed"></main>
<div class="more-wrap"><button class="more" id="btnMore" hidden>加载更多</button></div>

<input type="file" id="importFile" accept="application/json,.json" hidden>
<div class="viewer" id="viewer" hidden><img id="viewerImg" alt=""><button class="viewer-close" id="viewerClose">×</button><div class="viewer-prompt" id="viewerPrompt" hidden></div><button class="viewer-save" id="viewerSave">保存到手机</button></div>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet-box">
    <div class="sheet-txt" id="sheetTxt"></div>
    <button class="sheet-copy" id="sheetCopy">复制这段文字</button>
    <button class="sheet-del" id="sheetDel">删除这一条</button>
    <button class="sheet-cancel" id="sheetCancel">取消</button>
  </div>
</div>
<div id="toast"></div>

<script type="module">
import { openPhoneDB, getAllFromStore, addRecord, putRecord, getRecord, deleteRecord, dataUrlToBlob, resetPhoneDB } from './src/modules/phonedb.js';
// ⚠️ 导出必须走 saveFile：APK 的 WebView 不处理 <a download> 的 blob: 链接，点了是**静默失败**
// （浏览器里正常）→ 在 APK 里会弹"已导出"但下载目录里什么都没有。saveFile 会分流到原生桥。
import { saveFile, fmtTime } from './src/modules/utils.js';

// ======================== 标签定义 ========================
// post = 说说（他自己写的，云端心跳产出）；老笔记（thought）只在「全部」里翻得到
const TAGS = [
  { key:'all',     label:'全部',   test: () => true },
  { key:'post',    label:'说说',   test: it => it.tag === 'post' },
  { key:'photos',  label:'相册',   test: it => it.tag === 'photos' },
  { key:'quotes',  label:'兔宝说', test: it => it.tag === 'quotes' },
  { key:'browser', label:'浏览',   test: it => it.tag === 'browser' },
  { key:'todo',    label:'待办',   test: it => it.tag === 'todo' },
];
let _tag = 'post';
let _all = [];        // 归一化后的全部条目（时间倒序）
let _shown = 0;
const PAGE = 40;
let _objUrls = [];    // 本页创建的 blob URL，重绘前回收

// ======================== 工具 ========================
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

// 兼容 "2026-5-5 14:30:12" / "2026-05-05 14:30" / ISO
function parseTime(s) {
  if (!s) return 0;
  const m = String(s).match(/(\d{4})-(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{1,2})(?::(\d{1,2}))?/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0)).getTime();
  const t = Date.parse(s);
  return isNaN(t) ? 0 : t;
}

// 时间显示统一用 utils.js 的 fmtTime（今天/昨天/几月几日），别在这儿再写一份 ——
// 两份迟早漂移（第一版这里就复制过一份，跨年那支没补零，跟聊天里显示的格式对不上）

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

// ======================== 读数据 → 归一化 ========================
async function loadAll() {
  await openPhoneDB();
  const [memo, quotes, browser, drafts, mood, photos] = await Promise.all([
    getAllFromStore('xinye_memo'),   getAllFromStore('xinye_quotes'),
    getAllFromStore('xinye_browser'),getAllFromStore('xinye_drafts'), getAllFromStore('xinye_mood'),
    getAllFromStore('xinye_photos'),
  ]);

  const out = [];

  for (const m of memo) {
    if (!m.content) continue;
    if (m.type === 'todo') {
      out.push({ tag:'todo', ts: parseTime(m.time), text: m.content, store:'xinye_memo', id: m.id,
                 when: m.trigger_at ? parseTime(m.trigger_at) : 0, done: !!m.done });
    } else if (m.type === 'post') {
      // 他自己写的（没聊天的时候），见 posts.js。跟聊天里记的那些共用 xinye_memo，
      // 只靠 type 区分 —— 这样**不用动 DB_VER**（动它风险大），导出/导入也自动跟着走。
      out.push({ tag:'post', ts: parseTime(m.time), text: m.content, postId: m.postId || '', media: null,
                 store:'xinye_memo', id: m.id });
    } else {
      // ⚠️ 2026-09-16 合并：「记下来 / 没说出口 / 那天的心情」**不再贴角标**。
      //    她那边有 996 条，往下一翻根本不会去分辨是哪一类 —— 为一套只有最上面几条用得上的
      //    区分，让他每天做三次判断不划算。现在整页只有两种东西：
      //    **没角标 = 他聊天时写的**、**「说说」= 你没在场时他自己写的**。
      //    老数据的 drafts/mood 记录照样显示，只是不再贴标签（数据一条没删）。
      out.push({ tag:'thought', ts: parseTime(m.time), text: m.content, store:'xinye_memo', id: m.id });
    }
  }

  for (const it of quotes) {
    out.push({ tag:'quotes', ts: parseTime(it.time), text: it.content || '', src: it.source || '',
               store:'xinye_quotes', id: it.id });
  }

  for (const it of browser) {
    out.push({ tag:'browser', ts: parseTime(it.time), title: it.title || '', url: it.url || '', note: it.note || '',
               store:'xinye_browser', id: it.id });
  }

  // 草稿箱 / 心情：current + history
  // ⚠️ 2026-09-16 起这两类**不再产生新数据**（提示词里已并进「备忘录」，他写东西的出口从三个变一个）。
  //    这里留着只有一个目的：**让老记录照样显示出来** —— 不再贴角标，跟别的条目长一样。
  for (const store of ['xinye_drafts', 'xinye_mood']) {
    for (const rec of await (async () => {
      const a = []; const c = await getRecord(store, 'current'); if (c?.content) a.push(c);
      const h = await getRecord(store, 'history'); if (h?.items) a.push(...h.items);
      return a;
    })()) {
      if (!rec?.content) continue;
      out.push({ tag:'thought', ts: parseTime(rec.time), text: rec.content });
    }
  }

  // 他自己写的那些的配图/配音：**挂到那条文字上**，不单独成卡 ——
  // 否则同一件事在流里出现两遍（一张文字卡 + 一张图卡）。
  const _postById = new Map();
  for (const it of out) if (it.tag === 'post' && it.postId) _postById.set(it.postId, it);

  for (const p of photos) {
    if (p.post) {
      const kind = p.type === 'voice' ? 'voice' : 'image';
      const host = p.postId ? _postById.get(p.postId) : null;
      // prompt 一起带上 —— 她点开大图能看见他当时想画的是什么（2026-09-17）
      const _media = { kind, blob: p.blob, prompt: p.prompt || '' };
      if (host) host.media = _media;
      // 极端情况：配图到了、那条文字没到（APP 中途被杀过）→ 自己成一张卡，别丢
      else if (p.blob) out.push({ tag:'post', ts: parseTime(p.time), text:'', postId: p.postId || '', media: _media,
                                  store:'xinye_photos', id: p.id });
      continue;
    }
    if (p.type === 'memo') {
      out.push({ tag:'thought', ts: parseTime(p.time), text: p.caption || '', store:'xinye_photos', id: p.id });
    } else if (p.blob) {
      out.push({ tag:'photos', ts: parseTime(p.time), blob: p.blob, cap: p.caption || '', prompt: p.prompt || '',
                 store:'xinye_photos', id: p.id });
    }
  }

  out.sort((a, b) => b.ts - a.ts);
  _all = out;
}

// ======================== 渲染 ========================
function renderTags() {
  const bar = document.getElementById('tags');
  bar.textContent = '';
  for (const t of TAGS) {
    const n = _all.filter(t.test).length;

// ======================== 长按删除（2026-09-19 加） ========================
// 她这天翻这一页发现一堆重复的笔记（聊天里记下的"没说出口的/心情"），看着难受却删不掉。
// 长按一条 → 底部浮出浮层，里头的按钮按条目能力显示：
//   能定位到 IDB 记录的（it.store + it.id）→ 给「删除」；
//   有正文的 → 给「复制」（因为 .item 上禁了划词，得留条路把他的话带走）。
//   老数据的 drafts/mood 是聚合对象（key 是 'current'/'history'），删不了 → 只给复制。
const LP_FIRE_MS  = 450;   // 按住多久算长按。⚠️ 别调到 500 以上：系统的长按手势 ~500ms 就介入，
                           //    两边抢同一个手势，我们得先出手（配合 .item 的 user-select:none）
const LP_PRESS_MS = 140;   // 多久之后才给「按住了」的视觉反馈（给早了普通点击会闪一下）
const LP_MOVE_PX  = 10;    // 手指/鼠标抖这么多就当是在滚动，取消长按

let _lp = null;
// 长按刚触发的那张卡：它紧接着收到的那次 click 必须吞掉（松手时浏览器会补一个 click，
// 不拦会顺手点开大图 / 播语音 / 跳链接）。
// ⚠️ 别写成"多少毫秒内吞掉所有 click" —— 那样她在半秒内点「取消」也会被吞掉。
//    按来源判：只有落在**那张卡里面**的点击才吞，点浮层按钮一律放行。
let _lpFiredNode = null;

function _lpCancel() {
  if (!_lp) return;
  clearTimeout(_lp.tPress); clearTimeout(_lp.tFire);
  _lp.node.classList.remove('pressing');
  _lp = null;
}

function bindLongPress(node, it) {
  if (!it) return;   // 能不能删/能不能复制由 askDelete 判断，见下面那条注释
  node.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;   // 只认左键
    _lpCancel();
    _lpFiredNode = null;                                       // 清掉上一次留下的
    const rec = { node, x: e.clientX, y: e.clientY };
    rec.tPress = setTimeout(() => node.classList.add('pressing'), LP_PRESS_MS);
    rec.tFire  = setTimeout(() => {
      _lp = null;
      node.classList.remove('pressing');
      _lpFiredNode = node;
      try { navigator.vibrate && navigator.vibrate(15); } catch(_e) {}
      askDelete(it);
    }, LP_FIRE_MS);
    _lp = rec;
  });
  node.addEventListener('pointermove', e => {
    if (!_lp || _lp.node !== node) return;
    if (Math.abs(e.clientX - _lp.x) > LP_MOVE_PX || Math.abs(e.clientY - _lp.y) > LP_MOVE_PX) _lpCancel();
  });
  node.addEventListener('pointerup',    () => { if (_lp && _lp.node === node) _lpCancel(); });
  node.addEventListener('pointercancel',() => { if (_lp && _lp.node === node) _lpCancel(); });

  // 🔴🔴 抢不过系统时的兜底（2026-09-19 真机第二轮）：鸿蒙上长按会被系统整个拿走 ——
  //    开始划词、并发一个 pointercancel，上面那个计时器当场被掐，永远等不到 450ms。
  //    下面两条是另外两个独立机制，各堵一头：
  //    · selectstart —— 划词真正开始的那一刻，直接拦掉（不依赖 user-select 生效）
  //    · contextmenu —— 长按最后多半还会产生它，从那儿再开一次浮层
  //    三条路都通向 askDelete，谁先到算谁的（它内部有去重）。
  node.addEventListener('selectstart', e => e.preventDefault());
  node.addEventListener('contextmenu', e => {
    e.preventDefault();
    askDelete(it);
  });
}

document.addEventListener('click', e => {
  if (_lpFiredNode && _lpFiredNode.contains(e.target)) { e.stopPropagation(); e.preventDefault(); }
  _lpFiredNode = null;
}, true);

let _pendingDel = null;

function askDelete(it) {
  const t = String(it.text || '').trim();
  const canDel = !!(it.store && it.id != null);
  if (!t && !canDel) return;                                                    // 什么都做不了，别弹个只剩"取消"的空浮层
  if (!document.getElementById('sheet').hidden && _pendingDel === it) return;    // 两条路都到了，只当一次
  _pendingDel = it;
  // 浮层里现在有两个出口（复制 / 删除），话就别只冲着「删」说；
  // 老数据（草稿箱/心情那种聚合记录）删不了，就只剩复制可给。
  const cut = t.slice(0, 50) + (t.length > 50 ? '…' : '');
  const hint = (t && canDel) ? '删掉就找不回来了，想留就先复制。'
             : t ? '这条删不了（老数据），需要的话复制走。'
                 : '这一条删掉就找不回来了。';
  document.getElementById('sheetTxt').textContent = (t ? `「${cut}」\n` : '') + hint;
  document.getElementById('sheetCopy').hidden = !t;
  document.getElementById('sheetDel').hidden = !canDel;
  document.getElementById('sheet').hidden = false;
}

function closeSheet() {

// ⚠️ 说说带的图/语音在 xinye_photos 里用 postId 指向它，必须一起删 ——
//    只删文字的话那张图会变成"孤图"，loadAll 里那条兜底会把它单独渲染成一张卡。
async function deleteItem(it) {
  await openPhoneDB();
  if (it.tag === 'post' && it.postId) {
    const photos = await getAllFromStore('xinye_photos');
    for (const p of photos) {
      if (p && p.postId === it.postId && p.id != null) await deleteRecord('xinye_photos', p.id);
    }

  await deleteRecord(it.store, it.id);
}

// 复制 —— 是给 .item 上 user-select:none 的补偿（禁了划词，总得留条路把他的话带走）。
// clipboard API 要安全上下文 + 文档有焦点，WebView 里不一定给，所以留一条 execCommand 老路兜底。
async function copyText(s) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(s); return true; }
  } catch (_e) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = s; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, s.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (_e) { return false; }
}

  };
  return b;
}

// ======================== 导出（保持和旧版同一格式，互相兼容） ========================
function blobToBase64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(blob);
  });
}

document.getElementById('btnExport').onclick = async () => {
  const btn = document.getElementById('btnExport');
  btn.disabled = true;
  try {
    await openPhoneDB();
    const data = {};
    for (const store of ['xinye_memo','xinye_quotes','xinye_browser','xinye_drafts','xinye_mood']) {
      data[store] = await getAllFromStore(store);
    }
    const photos = await getAllFromStore('xinye_photos');
    const arr = [];
    for (const p of photos) {
      const rec = { ...p };
      if (rec.blob) { rec.dataUrl = await blobToBase64(rec.blob); delete rec.blob; }
      arr.push(rec);
    }
    data.xinye_photos = arr;
    data._exportedAt = new Date().toISOString();

    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    await saveFile(blob, `炘也的碎碎念_${new Date().toISOString().slice(0,10)}.json`);
    toast(window.AndroidDownload ? '已存到手机的「下载」目录' : '已导出');

    toast('导出失败：' + e.message);
  } finally { btn.disabled = false; }
};

// ======================== 导入（合并去重，绝不清空） ========================
const _sig = (store, r) =>
  [store, r.time || '', r.content || r.caption || r.title || r.line || r.song || ''].join('|');

async function mergeImport(raw) {
  const data = JSON.parse(raw);
  await openPhoneDB();
  let added = 0, skipped = 0;

  for (const store of ['xinye_memo','xinye_quotes','xinye_browser','xinye_photos']) {
    const incoming = data[store];
    if (!Array.isArray(incoming)) continue;
    const seen = new Set((await getAllFromStore(store)).map(r => _sig(store, r)));
    for (const item of incoming) {
      const { id, ...rec } = item;
      if (rec.dataUrl) { try { rec.blob = dataUrlToBlob(rec.dataUrl); } catch(e) { continue; } delete rec.dataUrl; }
      const k = _sig(store, rec);
      if (seen.has(k)) { skipped++; continue; }
      await addRecord(store, rec);
      seen.add(k); added++;
    }
  }

  // 草稿箱 / 心情：current 取更新的那条，history 合并去重
  for (const store of ['xinye_drafts','xinye_mood']) {
    const incoming = data[store];
    if (!Array.isArray(incoming)) continue;
    const inCur = incoming.find(r => r.key === 'current');
    const inHis = incoming.find(r => r.key === 'history');
    const cur  = await getRecord(store, 'current');
    const his  = (await getRecord(store, 'history')) || { key: 'history', items: [] };
    const seen = new Set(his.items.map(i => i.time + '|' + i.content));

    for (const it of (inHis?.items || [])) {
      if (!it?.content || seen.has(it.time + '|' + it.content)) { skipped++; continue; }
      his.items.push(it); seen.add(it.time + '|' + it.content); added++;
    }
    if (inCur?.content && (!cur || parseTime(inCur.time) > parseTime(cur.time))) {
      if (cur?.content) { his.items.unshift({ content: cur.content, time: cur.time }); }
      await putRecord(store, { key: 'current', content: inCur.content, time: inCur.time });
      added++;
    }
    his.items.sort((a, b) => parseTime(b.time) - parseTime(a.time));
    await putRecord(store, his);
  }

  return { added, skipped };
}

    // 独立打开：退回主 APP 存在 localStorage 的那个开关
    const s = localStorage.getItem('fox_dark');
    dark = s !== null ? s === '1' : window.matchMedia('(prefers-color-scheme:dark)').matches;
  } else {
    // 在主 APP 的 iframe 里：只认父页面的主题，别用 localStorage 盖掉它
    try { dark = window.parent.document.documentElement.dataset.theme === 'dark'; }
    catch(e) { dark = window.matchMedia('(prefers-color-scheme:dark)').matches; }
  }
  document.documentElement.classList.toggle('dark', dark);
  const mt = document.getElementById('metaThemeColor');
  if (mt) mt.content = dark ? '#16121e' : '#fff8f0';
}

function syncAvatar() {
  try {
    const src = window.parent?.document?.getElementById('headerAvatar')?.src;
    if (src) document.getElementById('ava').src = src;
  } catch(e) {}
}

// 兔宝翻他东西了 —— 下一次聊天他会"感知"到（chat.js 读这个 key）
// 带上她当时在看哪一类，他就能说出"你刚才去翻我相册了"这种具体的
const TAG2APP = { all: [], post: ['memo'], photos: ['photos'],
                  quotes: ['quotes'], browser: ['browser'], todo: ['memo'] };
function markVisit(tagKey) {
  const apps = TAG2APP[tagKey ?? _tag] || [];
  try { localStorage.setItem('xinye_phone_visit_pending', JSON.stringify({ time: Date.now(), apps })); } catch(e) {}
}

// 主 APP 每次切到这个 Tab 会调它（见 diary.js switchTab）
// ⚠️ 首次加载走的是 src 赋值那条路，**不会**调这个（见 diary.js 的 phone 分支），
//    所以 init() 末尾也要调一次 postsSeen()，否则第一次进来小圆点不消。
window.__fcOnShow = async () => {
  syncTheme(); syncAvatar(); markVisit();
  // 🔴 2026-09-21：**每次露面都把库重读一遍**。
  //    她的原话：「含笑花如果不后台退出 APP 重进的话，它好像不会自己刷新」。
  //    根因是这一页只有三条路会重读数据：① iframe 首次加载（一个会话只加载一次）
  //    ② __fcReload —— 而它原先**只在云端新「说说」到达时**才被调
  //    ③ 整页刷新。**聊天里写进备忘录的那些（这一页的绝大多数）一条都不走 ①②** ——
  //    她聊天时被记下来的事，切过来看不见，非得杀掉 APP 重进。这就是她说那个现象。
  //    __fcReload 自己会比对指纹，没变就什么都不做（不闪、不重排、滚动位置不动），
  //    所以这儿白读一次库而已。
  // 🔴 2026-09-22：消圆点挪到**读过之后**。原来是无条件先消 —— 一旦读库失败
  //    （连接被系统回收，见 __fcReload 里那段），就会变成「底栏的提示亮过、
  //    点进来却什么都没有」，比不给提示更让人摸不着头脑。**读到才算看过。**
  const ok = await window.__fcReload?.();
  if (ok !== false) postsSeen();
};

// 数据指纹 —— 只为「重排之前先问一句要不要重排」，别的什么都不用
function _feedSig() {
  const n = _all.length;
  if (!n) return '0';
  const head = _all[0];
  return `${n}|${head.ts}|${head.id != null ? head.id : ''}|${_all[n - 1].ts}`;
}

// 主 APP 拉到新贴、或她每次切进这一页时会调它（inbox.js 的 _pullPosts / __fcOnShow）
// opts.keepScroll：数据变了也留住她当前的滚动位置；默认回到顶部（进这一页就是来看新的）
window.__fcReload = async (opts = {}) => {
  const feed = document.getElementById('feed');
  const before = _feedSig();
  try { await loadAll(); }
  catch (e) {
    // 🔴 2026-09-22：这儿原来是静默 `return` —— 读库失败时页面上"什么都不发生"，
    //    她连着几轮说的「不退出重进就不刷新」正是栽在这条上（根因见 phonedb.js 的
    //    openPhoneDB：iframe 自己那条连接被系统回收之后，_db 这个引用还在，
    //    但任何读取都抛，于是每次切进来都白读一遍；重开 APP 换了新连接就好了）。
    //    丢掉旧连接重开一次再读 —— 她完全无感；两次都失败才真的放弃这一轮。
    console.log('[碎碎念] 读库失败，重开连接再读一次：', e && e.message);
    try { resetPhoneDB(); await loadAll(); }
    catch (e2) { console.log('[碎碎念] 重试仍失败，这一页先不动：', e2 && e2.message); return false; }
  }
  // 一条都没变就别重排了：重排会闪一下，还会把「加载更多」翻过的页数打回第一页
  if (_feedSig() === before && !opts.force) return true;
  _shown = PAGE;
  renderTags();
  renderFeed(true);
  if (feed) feed.scrollTop = opts.keepScroll ? feed.scrollTop : 0;
  return true;
};

function postsSeen() {
  // 她翻过了 → 摘掉底栏那个小圆点（那个元素在父页面里）
  try { window.parent.__fcPostsSeen?.(); } catch (e) {}
}

// ======================== 启动 ========================
document.getElementById('btnMore').onclick = () => { _shown += PAGE; renderFeed(false); };

(async function init() {
  syncTheme();
  syncAvatar();
  if (window.self === window.top) {
    // 被当成独立页面打开（比如桌面上那个旧图标）—— 这边读的是浏览器沙箱，不是他真正在写的那个库
    document.getElementById('tip').hidden = false;
  } else {
    try {
      const ph = window.parent.document.documentElement;
      new MutationObserver(syncTheme).observe(ph, { attributes: true, attributeFilter: ['data-theme'] });
    } catch(e) {}
  }
  document.getElementById('tipClose').onclick = () => document.getElementById('tip').hidden = true;

  try {
    await loadAll();
  } catch (e) {
    document.getElementById('feed').appendChild(el('div', 'empty', '读到数据时出错了：' + e.message));
    return;
  }
  _shown = PAGE;
  renderTags();
  renderFeed(true);
  markVisit();
  postsSeen();     // 首次进来也要消掉小圆点（见 __fcOnShow 上面的注释）
})();
</script>
</body>
</html>
