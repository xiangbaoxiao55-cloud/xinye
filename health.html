<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" id="metaThemeColor" content="#fff8f0">
<title>健康 · 饮食</title>
<script>
// 主题预设：必须早于样式表，否则暗色下会先闪一下亮色
try {
  var _p = window.parent;
  if (_p && _p !== window && _p.document.documentElement.dataset.theme === 'dark') {
    document.documentElement.dataset.theme = 'dark';
  }
} catch (e) {}
</script>
<link rel="stylesheet" href="./src/styles/variables.css">
<link rel="stylesheet" href="./src/styles/themes.css">
<link rel="stylesheet" href="./src/styles/icons.css">
<link rel="stylesheet" href="./src/styles/health.css">
</head>
<body>

<div class="h-top">
  <button class="h-back" id="btnBack" aria-label="返回">‹</button>
  <div class="h-title">健康</div>
  <div class="spacer"></div>
  <button class="h-profile" id="btnProfile"><b id="profName">…</b> ▾</button>
</div>

<div class="h-tabs">
  <button class="h-tab on" data-pane="today">今日</button>
  <button class="h-tab" data-pane="trend">趋势</button>
  <button class="h-tab" data-pane="profile">档案</button>
</div>

<div class="h-main" id="main">

  <!-- ── 今日 ── -->
  <div class="h-pane on" id="pane-today">
    <div class="h-date">
      <button class="nav" id="dPrev">‹</button>
      <b id="dLabel">今天</b>
      <button class="nav" id="dNext">›</button>
      <button class="today" id="dToday" style="display:none">回到今天</button>
    </div>

    <div class="h-kcal">
      <div>
        <span class="num" id="kEat">0</span><span class="of">/ <span id="kTarget">—</span></span><span class="unit">kcal</span>
      </div>
      <div class="left" id="kLeft"></div>
    </div>
    <div class="bar"><i id="kBar" style="width:0%"></i></div>

    <div class="h-macros" id="macros"></div>
    <div class="h-meals" id="meals"></div>
  </div>

  <!-- ── 趋势 ── -->
  <div class="h-pane" id="pane-trend">
    <div class="h-sec">
      <div class="h-sec-title">体重</div>
      <div class="h-kv">
        <span class="k">今天称</span>
        <input type="number" id="wInput" step="0.1" inputmode="decimal" placeholder="—">
        <span class="v">kg</span>
      </div>
      <canvas class="h-chart" id="wChart"></canvas>
      <div class="h-tip" id="wTip"></div>
    </div>
    <div class="h-sec">
      <div class="h-sec-title">近 7 天热量</div>
      <canvas class="h-chart" id="kChart"></canvas>
      <div class="h-tip" id="kTip"></div>
    </div>
  </div>

  <!-- ── 档案 ── -->
  <div class="h-pane" id="pane-profile">
    <div class="h-sec" id="profForm">
      <div class="h-sec-title" id="profFormTitle">我的档案</div>
      <div class="h-kv"><span class="k">称呼</span><input id="fName" placeholder="兔宝"></div>
      <div class="h-kv"><span class="k">性别</span>
        <select id="fSex"><option value="female">女</option><option value="male">男</option></select>
      </div>
      <div class="h-kv"><span class="k">出生年</span><input id="fYear" type="number" inputmode="numeric" placeholder="1987"></div>
      <div class="h-kv"><span class="k">身高</span><input id="fHeight" type="number" inputmode="decimal" placeholder="—"><span class="v">cm</span></div>
      <div class="h-kv"><span class="k">目标体重</span><input id="fTargetW" type="number" inputmode="decimal" placeholder="—"><span class="v">kg</span></div>
      <div class="h-kv"><span class="k">活动量</span><select id="fAct"></select></div>
      <button class="h-btn" id="btnSaveProfile">保存</button>
      <div class="h-tip" id="targetTip"></div>
    </div>
    <div class="h-sec">
      <div class="h-sec-title">档案切换（家人共用这台手机时各记各的）</div>
      <div id="profList"></div>
      <button class="h-btn ghost" id="btnAddProfile">＋ 添加一个档案</button>
    </div>
    <div class="h-sec">
      <div class="h-sec-title">数据</div>
      <div class="h-tip" id="libTip"></div>
    </div>
  </div>

</div>

<button class="h-fab" id="btnAdd">＋ 记一笔</button>

<!-- ── 食物选择面板 ── -->
<div class="h-sheet" id="sheet">
  <div class="h-sheet-body">
    <div class="h-sheet-head">
      <div class="h-sheet-title" id="sheetTitle">记一笔</div>
      <input class="h-search" id="searchInput" autocomplete="off" placeholder="搜食物（也可打拼音首字母，如 jxr）">
      <button class="h-addown" id="newFoodBtn" style="display:none">库里没有？自己加一个 ›</button>
    </div>
    <div class="h-chips" id="chips"></div>
    <div class="h-results" id="results"><div class="h-loading">加载食物库…</div></div>

    <!-- 自己加食物（不用称重，按你平时的一份来） -->
    <div class="h-newfood" id="newFoodBox" style="display:none">
      <div class="h-line"><span class="k">名字</span><input id="nfName" placeholder="饺子"></div>
      <div class="h-line"><span class="k">这一份叫</span><input id="nfUnit" value="份" maxlength="3" placeholder="个 / 只 / 碗"></div>
      <div class="h-line"><span class="k">一份多少热量</span><input id="nfKcal" type="number" inputmode="decimal" placeholder="50"><span class="v">千卡</span></div>
      <div class="h-tip" id="nfHint">不用称重。你平时怎么数就怎么填——一个饺子、一只鸡腿、一碗饭。</div>
      <button class="h-btn" id="btnSaveNewFood">存起来，以后能直接用</button>
      <button class="h-btn ghost" id="btnCancelNewFood">取消</button>
    </div>

    <div class="h-grams" id="gramsBox" style="display:none">
      <div class="picked"><span class="nm" id="pickedName"></span><button class="rm" id="btnUnpick">重选</button></div>
      <div class="h-grams-row">
        <input id="gramsInput" type="number" inputmode="decimal" value="100">
        <span class="u" id="gramsUnit">克</span>
        <span class="preview" id="gramsPreview"></span>
      </div>
      <div class="h-quick" id="quickGrams"></div>
      <div class="h-line" id="edibleLine" style="display:none">
        <span class="k">我称的是</span>
        <select id="edibleSel">
          <option value="whole">整只 / 带骨</option>
          <option value="edible">可食部分</option>
        </select>
      </div>
      <div class="h-line"><span class="k">算作</span><select id="mealSel"></select></div>
      <div class="h-warn" id="warnBox"></div>
      <button class="h-btn" id="btnConfirm">记下</button>
    </div>
  </div>
</div>

<div class="h-toast" id="toast"></div>
<script type="module" src="./src/health.js"></script>
</body>
</html>
