<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Us on the Moon</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #2b2d3a;
      --paper: #0f1729;
      --gold: #f6c85f;
      --gold-deep: #c4963a;
      --fox: #e8845b;
      --fox-dark: #c06040;
      --rabbit: #f4f0e8;
      --rabbit-shadow: #d8d0c4;
      --pink: #ef8d7d;
      --blue: #8ecae6;
      --blue-deep: #5a9fbf;
      --star: #fffde8;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      margin: 0; overflow: hidden;
      background: var(--paper);
    }

    body { display: grid; place-items: center; }

    svg {
      display: block;
      width: 100vw; height: 100vh;
      touch-action: manipulation;
    }

    .line, .soft-line, .color-shape {
      vector-effect: non-scaling-stroke;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .line {
      fill: none;
      stroke: var(--ink);
      stroke-width: 4.1;
    }

    .soft-line {
      fill: none;
      stroke: var(--ink);
      stroke-width: 2.8;
    }

    .color-shape {
      stroke: var(--ink);
      stroke-width: 3.5;
    }

    .fine { stroke-width: 2.2; }
    .bold { stroke-width: 5.2; }
    .no-stroke { stroke: none; stroke-width: 0; }
    .gold-line { stroke: var(--gold-deep); }
    .fox-line { stroke: var(--fox-dark); }
    .pink-line { stroke: var(--pink); }
    .blue-line { stroke: var(--blue-deep); }
    .star-line { stroke: #c8c4a0; stroke-width: 2.0; }

    #drawing-cursor {
      pointer-events: none;
      opacity: 0;
      filter: drop-shadow(0 2px 1px rgb(0 0 0 / 30%));
    }

    #drawing-cursor .pencil-body {
      fill: #f3b45b;
      stroke: var(--ink);
      stroke-width: 2.5;
      stroke-linejoin: round;
    }

    #drawing-cursor .pencil-wood {
      fill: #f4d6ad;
      stroke: var(--ink);
      stroke-width: 2.5;
    }

    #drawing-cursor .pencil-lead { fill: var(--ink); }

    #replay {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 2;
      min-width: 76px; min-height: 40px;
      padding: 8px 16px;
      border: 2px solid var(--gold-deep);
      border-radius: 6px;
      background: rgb(15 23 41 / 88%);
      color: var(--star);
      font: 700 14px/1 Georgia, serif;
      cursor: pointer;
      box-shadow: 3px 3px 0 rgb(246 200 95 / 12%);
      transition: transform 120ms ease, box-shadow 120ms ease;
      backdrop-filter: blur(3px);
    }

    #replay:hover {
      transform: translate(-1px, -1px) rotate(-1deg);
      box-shadow: 4px 4px 0 rgb(246 200 95 / 18%);
    }

    #replay:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 rgb(246 200 95 / 10%);
    }

    #replay:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 4px;
    }
  </style>
</head>

  <button id="replay" type="button">Replay</button>

  <script>
    (() => {
      const svg = document.querySelector('#canvas');
      const cursor = document.querySelector('#drawing-cursor');
      const replay = document.querySelector('#replay');
      const strokes = [...document.querySelectorAll('[data-draw]')]
        .sort((a, b) => Number(a.dataset.order) - Number(b.dataset.order));
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let runId = 0;

      const wait = (ms, id) => new Promise(resolve => {
        const started = performance.now();
        const tick = now => {
          if (id !== runId || now - started >= ms) return resolve();
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      });

      function prepare() {
        cursor.style.opacity = '0';
        strokes.forEach(stroke => {
          const length = Math.max(1, stroke.getTotalLength());
          stroke.dataset.length = length;
          stroke.style.strokeDasharray = `${length + 1}`;
          stroke.style.strokeDashoffset = `${length + 1}`;
          stroke.style.visibility = 'hidden';
          stroke.style.fillOpacity = '0';
        });
      }

      function drawStroke(stroke, id) {
        return new Promise(resolve => {
          const length = Number(stroke.dataset.length);
          const requested = Number(stroke.dataset.duration);
          const natural = Math.max(120, Math.min(720, length * 0.82));
          const duration = (requested || natural) * (reduceMotion ? 0.22 : 1);
          const fillTarget = Number(stroke.dataset.fill || 0);
          const started = performance.now();

          stroke.style.visibility = 'visible';
          cursor.style.opacity = '1';

          const frame = now => {
            if (id !== runId) return resolve();
            const raw = Math.min(1, (now - started) / duration);
            const progress = 1 - Math.pow(1 - raw, 2);
            const point = stroke.getPointAtLength(length * progress);
            const ahead = stroke.getPointAtLength(Math.min(length, length * progress + 2));
            const angle = Math.atan2(ahead.y - point.y, ahead.x - point.x) * 180 / Math.PI;

            stroke.style.strokeDashoffset = `${length * (1 - progress)}`;
            if (fillTarget) {
              const fillProgress = Math.max(0, (raw - 0.5) / 0.5);
              stroke.style.fillOpacity = `${fillTarget * fillProgress}`;
            }
            cursor.setAttribute('transform', `translate(${point.x} ${point.y}) rotate(${angle})`);

            if (raw < 1) requestAnimationFrame(frame);
            else {
              stroke.style.strokeDashoffset = '0';
              stroke.style.fillOpacity = `${fillTarget}`;
              resolve();
            }
          };

          requestAnimationFrame(frame);
        });
      }

      async function play() {
        const id = ++runId;
        prepare();
        replay.disabled = true;
        replay.style.opacity = '0.48';
        await wait(reduceMotion ? 70 : 400, id);

        for (const stroke of strokes) {
          if (id !== runId) return;
          await drawStroke(stroke, id);
          const pause = Number(stroke.dataset.pause || 28) * (reduceMotion ? 0.2 : 1);
          await wait(pause, id);
        }

        if (id !== runId) return;
        cursor.style.opacity = '0';
        replay.disabled = false;
        replay.style.opacity = '1';
      }

      replay.addEventListener('click', play);
      svg.addEventListener('dblclick', play);
      window.addEventListener('load', play, { once: true });
    })();
  </script>
