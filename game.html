<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>跟炘也玩一会儿</title>
<link rel="stylesheet" href="src/game/game.css">
<!-- 🔴 这一行必须在下面那个 module 之前跑完：db.js / ai.js 读的是 window.__APP_ID__，
     而 iframe 里拿不到主 APP 设的那个全局（它只存在于父页面）。
     普通 script 是同步执行的，module 是 defer 的，所以顺序天然是对的。 -->
<script>
  window.__APP_ID__ = (new URLSearchParams(location.search).get('app') === 'choubao') ? 'choubao' : 'xinye';
</script>
</head>
<body>
<!-- 棋子形状（2026-10-05 兔宝要的：棋子画成小动物，不再是圆点）。
     用 <symbol> 定义一次、每颗子 <use> 引用 —— 满盘 225 颗也不会把 DOM 撑大。
     ⚠️ 渐变用 userSpaceOnUse：默认的 objectBoundingBox 会让每个图形各自算一份，
        头 / 身子 / 耳朵叠在一起时接缝处会出现色阶断层。
     ⚠️ 图形的 fill 故意不写死 —— 让 .stone.b / .stone.w 用 CSS 的 fill:url(#…) 上色，
        这样「哪个颜色画哪种动物」是 CSS 说了算，换组合不用动形状。 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="gStoneB" gradientUnits="userSpaceOnUse" cx="11" cy="9" r="19">
      <stop offset="0" stop-color="#75655d"/><stop offset="1" stop-color="#302823"/>
    </radialGradient>
    <radialGradient id="gStoneW" gradientUnits="userSpaceOnUse" cx="11" cy="9" r="19">
      <stop offset="0" stop-color="#fffefb"/><stop offset="1" stop-color="#d7c8ae"/>
    </radialGradient>

    <symbol id="icoRabbit" viewBox="0 0 32 32">
      <ellipse cx="11.6" cy="7.6" rx="2.5" ry="5.0" transform="rotate(-9 11.6 7.6)"/>
      <ellipse cx="20.4" cy="7.6" rx="2.5" ry="5.0" transform="rotate(9 20.4 7.6)"/>
      <circle cx="16" cy="16" r="10"/>
    </symbol>

    <symbol id="icoCat" viewBox="0 0 32 32">
      <path d="M8.7 11.6 L6.6 2.6 L14.9 7.1 Z"/>
      <path d="M23.3 11.6 L25.4 2.6 L17.1 7.1 Z"/>
      <circle cx="16" cy="16" r="10"/>
    </symbol>
  </defs>
</svg>
<!-- 🔴 这两条必须写在**文档内**的 <style> 里，不能挪去 src/game/game.css！
     外部样式表里的 `url(#gStoneB)` 是相对**样式表自己的 URL** 解析的
     → 会变成 `.../src/game/game.css#gStoneB` → 找不到 → 按 SVG 规范"无效 paint server = 不画"
     → 棋子形状整个消失，只剩中间那个小红点（2026-10-05 就是这么踩的，截图才看出来）。
     文档内 <style> 的 url(#…) 才相对文档解析。 -->
<style>
  .stone.b .ico{fill:url(#gStoneB)}
  .stone.w .ico{fill:url(#gStoneW)}
</style>
<div id="app">

  <!-- ==================== ① 大厅 ==================== -->
  <section class="screen on" id="scr-lobby">
    <div class="lobby">
      <div class="back" onclick="goBack()">‹ 回聊天</div>
      <h2 id="lobbyTitle">跟炘也玩一会儿</h2>
      <p class="sub" id="lobbySub">加载中…</p>
      <div class="resume" id="resumeBar" style="display:none" onclick="resumeGame()">
        有一局没下完，接着下<span>›</span>
      </div>

      <div class="grid">
        <div class="g" id="card-gomoku" onclick="startGame('gomoku')">
          <span class="tag" id="tagGomoku" style="display:none"></span>
          <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".85"><path d="M6 10h28M6 20h28M6 30h28M10 6v28M20 6v28M30 6v28" opacity=".5"/><circle cx="20" cy="20" r="4.2" fill="currentColor"/><circle cx="30" cy="10" r="4.2" fill="var(--card)"/></svg>
          <div class="n">五子棋</div><div class="m">两个人 · 一盘十来分钟</div>
        </div>

        <div class="g lock">
          <span class="tag">新</span>
          <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M20 4l3 11 11 4-11 3-3 14-3-14-11-3 11-4z"/><circle cx="20" cy="20" r="2" fill="currentColor"/></svg>
          <div class="n">飞行棋</div><div class="m">掷骰子 · 最适合边玩边聊</div>
        </div>

        <div class="g lock">
          <span class="tag">做好了再来</span>
          <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="7" y="9" width="15" height="22" rx="2.5" transform="rotate(-12 14 20)"/><rect x="13" y="8" width="15" height="22" rx="2.5"/><rect x="19" y="9" width="15" height="22" rx="2.5" transform="rotate(12 26 20)"/></svg>
          <div class="n">斗地主</div><div class="m">三个人 · 叫上臭宝</div>
        </div>

        <div class="g lock">
          <span class="tag">做好了再来</span>
          <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M8 19L20 9l12 10v13H8z"/><path d="M17 32v-7h6v7"/></svg>
          <div class="n">大富翁</div><div class="m">地图是我们去过的地方</div>
        </div>

        <div class="g lock">
          <span class="tag">做好了再来</span>
          <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M20 5l4 9 9 1-6 7 2 10-9-5-9 5 2-10-6-7 9-1z"/></svg>
          <div class="n">跳棋</div><div class="m">两个人</div>
        </div>

        <div class="g lock">
          <span class="tag">以后</span>
          <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="11" y="6" width="18" height="28" rx="3"/><circle cx="20" cy="15" r="2.5"/><circle cx="20" cy="25" r="2.5"/></svg>
          <div class="n">麻将</div><div class="m">广东鸡胡 · 二人版</div>
        </div>
      </div>

      <div class="opts">
        <div class="opt">
          <div>军师<small>代码先算几步好棋递给他，走哪步还是他挑</small></div>
          <span class="sw" id="swAdvisor" onclick="toggleAdvisor()"></span>
        </div>
        <div class="opt">
          <div>游戏里用的模型</div>
          <select class="sel" id="selModel"></select>
        </div>
      </div>
    </div>
  </section>

  <!-- ==================== ② 对局 ==================== -->
  <section class="screen" id="scr-play">
    <div class="bar">
      <span class="x" onclick="backToLobby()" title="回游戏大厅（这局给你留着，随时能续）">‹</span>
      <span class="t" id="playTitle"><span id="playName">五子棋</span><small id="playSub"></small></span>
      <span class="more" id="btnResign" onclick="resign()">认输</span>
    </div>
    <div class="players">
      <div class="pl" id="plAi">
        <span class="av" id="avAi">炘</span>
        <div><div class="nm" id="nmAi">炘也</div><div class="st"><span class="dot b" id="dotAi"></span><span id="stAi">执黑</span></div></div>
      </div>
      <div class="score" id="score"><b>0</b>:<b>0</b></div>
      <div class="pl r" id="plMe">
        <span class="av" id="avMe">兔</span>
        <div><div class="nm">兔宝</div><div class="st"><span id="stMe">执白</span><span class="dot w" id="dotMe"></span></div></div>
      </div>
    </div>
    <div class="boardwrap"><div class="board" id="board"></div></div>
    <div class="talk">
      <div class="log" id="talkLog"></div>
      <div class="input">
        <input id="sayInput" type="text" placeholder="边下边跟他说…" autocomplete="off">
        <button class="send" id="btnSay" disabled>↑</button>
      </div>
    </div>
  </section>

  <!-- ==================== ③ 结算 ==================== -->
  <div class="sheet" id="sheet">
    <div class="card">
      <div class="who" id="doneWho">—</div>
      <div class="sum" id="doneSum">他在想怎么跟你说…</div>
      <div class="btns">
        <button onclick="backToLobby()">再下一盘</button>
        <button class="primary" onclick="backToChat()">回聊天</button>
      </div>
    </div>
  </div>

  <div class="mockflag" id="mockFlag" style="display:none">假 AI 模式 · 不发请求</div>
  <div id="toast"></div>
</div>

<script type="module" src="src/game/main.js"></script>
</body>
</html>
