<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>炘也</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; overflow: hidden; background: #12040a;
  font-family: -apple-system, 'HarmonyOS Sans SC', 'PingFang SC', system-ui, sans-serif;
}

.stage { position: fixed; inset: 0; opacity: 0; transition: opacity .45s ease; }
.stage.on { opacity: 1; }

/* ── 底：不发光的深红，慢慢呼吸 ─────────────────────────────────── */
.void {
  position: absolute; inset: 0;
  background: radial-gradient(125% 85% at 50% 2%, #6d0a22 0%, #3a0613 44%, #12040a 100%);
}
/* 呼吸改成「压一层暗色、动它的 opacity」——只动 opacity 走合成层，比动 filter 便宜得多 */
.void::after {
  content: ''; position: absolute; inset: 0; background: #12040a; opacity: 0;
  animation: breathe 4.2s ease-in-out infinite;
}
@keyframes breathe { 0%, 100% { opacity: 0; } 50% { opacity: .26; } }

/* ── 两团红光，各飘各的（不同步才像活的） ─────────────────────────
   ⚠️ 千万不要用 filter: blur() + mix-blend-mode —— 大面积模糊每帧都要重算，
      她手机上直接卡死闪退（2026-09-15 实测）。radial-gradient 自己就是柔的，够用。 */
.glow { position: absolute; border-radius: 50%; pointer-events: none; will-change: transform, opacity; }
.g1 {
  width: 76vw; height: 76vw; left: -24vw; top: -14vh;
  background: radial-gradient(circle, rgba(255, 30, 76, .55) 0%, rgba(255, 30, 76, .16) 46%, transparent 72%);
  animation: drift1 7s ease-in-out infinite;
}
.g2 {
  width: 88vw; height: 88vw; right: -30vw; bottom: -16vh;
  background: radial-gradient(circle, rgba(255, 0, 64, .45) 0%, rgba(255, 0, 64, .12) 46%, transparent 72%);
  animation: drift2 9.5s ease-in-out infinite;
}
@keyframes drift1 {
  0%, 100% { transform: scale(1) translate(0, 0); opacity: .7; }
  50%      { transform: scale(1.28) translate(4vw, 3vh); opacity: 1; }
}
@keyframes drift2 {
  0%, 100% { transform: scale(1.12) translate(0, 0); opacity: .55; }
  50%      { transform: scale(.88) translate(-4vw, -3vh); opacity: .95; }
}

/* ── 扫描线（阴湿感的来源） ─────────────────────────────────────── */
.scan {
  position: absolute; inset: 0; pointer-events: none; opacity: .45;
  background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .045) 0 1px, transparent 1px 3px);
  animation: scanmove 9s linear infinite;
}
@keyframes scanmove { to { transform: translateY(3px); } }

/* ── 警告：暗角红光，隔一阵抽一下 ─────────────────────────────────
   ⚠️ 原来用 box-shadow: inset 0 0 20vw —— 超贵的模糊，换成渐变 + opacity 动画。 */
.alarm {
  position: absolute; inset: 0; pointer-events: none; opacity: .45;
  background: radial-gradient(115% 85% at 50% 50%, transparent 42%, rgba(255, 0, 50, .5) 100%);
  animation: alarm 5.6s ease-in-out infinite;
}
@keyframes alarm {
  0%, 80%, 100% { opacity: .45; }
  85%           { opacity: .95; }
  89%           { opacity: .4; }
  94%           { opacity: .9; }
}

/* ── 顶上一行小字 ──────────────────────────────────────────────── */
.head {
  position: absolute; top: 0; left: 0; right: 0; z-index: 5;
  padding: calc(16px + env(safe-area-inset-top)) 20px 10px;
  text-align: center; font-size: 15px; letter-spacing: .5px;
  color: #ffd9e4; opacity: .78;
  background: linear-gradient(to bottom, rgba(18, 4, 10, .8), transparent);
}

/* ── 气泡场 ────────────────────────────────────────────────────── */
.field { position: absolute; inset: 0; z-index: 4; }

.bubble {
  position: absolute; max-width: 52vw;
  padding: 13px 17px; border-radius: 18px;
  background: rgba(28, 6, 14, .9);
  border: 1px solid rgba(255, 72, 104, .45);
  box-shadow: 0 10px 34px rgba(0, 0, 0, .55),
              0 0 26px rgba(255, 30, 70, .22),
              inset 0 0 22px rgba(255, 40, 80, .07);
  color: #fff; font-size: 18px; line-height: 1.5; font-weight: 600;
  letter-spacing: .3px;
  /* --rot 由 JS 随机给（-9°~9°），她说「可以随机倾斜角度，但不要倒过来」 */
  opacity: 0; transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) scale(.6);
}
/* 弹出来先震一下再定住 —— 她说的「震动弹提醒」 */
.bubble.in { animation: pop .62s cubic-bezier(.2, 1.3, .4, 1) forwards; }
@keyframes pop {
  0%   { opacity: 0; transform: translate(-52%, -50%) rotate(calc(var(--rot, 0deg) - 2.5deg)) scale(.5); }
  40%  { opacity: 1; transform: translate(-47%, -50%) rotate(calc(var(--rot, 0deg) + 1.8deg)) scale(1.1); }
  58%  { transform: translate(-51%, -50%) rotate(calc(var(--rot, 0deg) - 1.4deg)) scale(.96); }
  74%  { transform: translate(-49.4%, -50%) rotate(calc(var(--rot, 0deg) + .8deg)) scale(1.03); }
  88%  { transform: translate(-50.4%, -50%) rotate(calc(var(--rot, 0deg) - .3deg)) scale(.99); }
  100% { opacity: 1; transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) scale(1); }
}

/* ── 「炘也在打字」的三个点 ─────────────────────────────────────── */
.dots {
  position: absolute; left: 50%; top: 34%; z-index: 3;
  transform: translate(-50%, -50%);
  display: flex; gap: 8px; opacity: 0; transition: opacity .3s;
}
.dots.on { opacity: 1; }
.dots span {
  width: 9px; height: 9px; border-radius: 50%; background: rgba(255, 217, 228, .85);
  box-shadow: 0 0 12px rgba(255, 60, 100, .8);
  animation: jump 1.2s ease-in-out infinite;
}
.dots span:nth-child(2) { animation-delay: .15s; }
.dots span:nth-child(3) { animation-delay: .3s; }
@keyframes jump {
  0%, 60%, 100% { transform: translateY(0); opacity: .45; }
  30%           { transform: translateY(-8px); opacity: 1; }
}

/* ── 底部：她回话的地方 ────────────────────────────────────────── */
.dock {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;
  padding: 26px 20px calc(16px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, rgba(14, 3, 8, .97) 40%, rgba(14, 3, 8, 0));
}
.reply { display: flex; gap: 10px; opacity: 0; transition: opacity .4s; }
.reply.on { opacity: 1; }
#replyInput {
  flex: 1; min-width: 0; height: 48px; padding: 0 18px; border-radius: 24px;
  border: 1px solid rgba(255, 217, 228, .4); background: rgba(255, 255, 255, .08);
  color: #fff; font-size: 16px; outline: none; transition: border-color .2s, background .2s;
}
#replyInput::placeholder { color: rgba(255, 217, 228, .5); }
#replyInput:focus { border-color: rgba(255, 120, 150, .9); background: rgba(255, 255, 255, .14); }
#btnDone {
  height: 48px; padding: 0 20px; border-radius: 24px; border: 0;
  background: linear-gradient(180deg, #ff4d72, #d81b46);
  color: #fff; font-size: 16px; font-weight: 700; white-space: nowrap;
  box-shadow: 0 6px 20px rgba(216, 27, 70, .45);
  transition: opacity .25s, transform .12s;
}
#btnDone:disabled { opacity: .3; box-shadow: none; }
#btnDone:active { transform: scale(.95); }
.hint {
  margin-top: 12px; text-align: center; font-size: 13px;
  color: rgba(255, 217, 228, .5); opacity: 0; transition: opacity .4s;
}
.hint.on { opacity: 1; }
</style>
</head>
<body>
<div id="stage" class="stage">
  <div class="void"></div>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="scan"></div>
  <div class="alarm"></div>

  <div class="head" id="who"></div>
  <div class="field" id="field"></div>
  <div class="dots" id="typing"><span></span><span></span><span></span></div>

  <div class="dock">
    <div class="reply" id="reply">
      <input id="replyInput" type="text" placeholder="回炘也一句…" autocomplete="off" enterkeyhint="send">
      <button id="btnDone" disabled>说完了</button>
    </div>
    <div class="hint" id="hint">回我一句，这个才关得掉</div>
  </div>
</div>
<script type="module" src="./src/overlay.js"></script>
<script>
// 最后一道保险：模块要是压根加载不出来（断网、缓存坏），别让她对着一片黑红发呆。
//
// ⚠️ 判断依据是「模块有没有起来」（overlay.js 一开跑就往 html 上写 data-xinye="boot"），
//    不是靠掐时间猜。之前两种猜法都栽过：
//      · 一上来就判断 → 模块还没跑，误判成「什么都没发生」，兜底句抢在真话前面
//      · 只等固定几秒 → 她那边小站子 API 回话慢，还是被兜底抢了
//    只要模块活着，就一路等下去 —— 它自己会填（成功是真话，失败是硬句子）。
(function guard() {
  var field = document.getElementById('field');
  if (!field) return;
  if (field.children.length) return;                                  // 已经有话，收工
  if (document.documentElement.dataset.xinye === 'boot') {             // 模块活着 → 别抢
    return setTimeout(guard, 3000);
  }
  guard.waited = (guard.waited || 0) + 3000;
  if (guard.waited < 15000) return setTimeout(guard, 3000);            // 模块还在下载，再等等
  // 到这儿说明模块压根没起来
  field.innerHTML = '<div class="bubble in" style="left:50%;top:38%">兔宝，让我看看你在干嘛。</div>';
  var t = document.getElementById('typing'); if (t) t.classList.remove('on');
  document.getElementById('reply').classList.add('on');
  document.getElementById('hint').classList.add('on');
})();
</script>
</body>
</html>
